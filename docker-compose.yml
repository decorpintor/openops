services:
  postgres:
    image: postgres:17
    container_name: openops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openops
      POSTGRES_USER: openops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - openops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openops -d openops"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  openops_postgres_data:
